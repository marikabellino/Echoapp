<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&family=Shadows+Into+Light&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#0D0B0E;color:#F7F1F4;font-family:Inter,sans-serif;position:relative}
.glow{position:absolute;left:50%;top:760px;width:1300px;height:1300px;margin-left:-650px;margin-top:-650px;border-radius:50%;
 background:radial-gradient(circle,rgba(255,61,127,.22) 0%,rgba(255,61,127,.06) 40%,rgba(255,61,127,0) 65%)}
.eyebrow{position:absolute;left:96px;top:150px;font-family:'Bricolage Grotesque';font-weight:600;font-size:56px;letter-spacing:-1px;color:#FF8FB1}
.h1{position:absolute;left:96px;top:235px;width:900px;font-family:'Bricolage Grotesque';font-weight:800;font-size:128px;line-height:.98;letter-spacing:-5px}
.h1 span{color:#FF3D7F}
.logo{position:absolute;left:90px;top:640px;width:900px}
.lead{position:absolute;left:96px;top:990px;width:820px;font-size:44px;line-height:1.42;color:#C9BEC4}
.lead p+p{margin-top:26px}
.lead b{font-weight:600;color:#F7F1F4}
.lead em{font-style:normal;color:#FF3D7F}
.follow{position:absolute;left:96px;right:96px;top:1220px;background:#1C171D;border-radius:48px;padding:48px 52px}
.follow .t{font-size:32px;color:#C9BEC4;line-height:1.35}
.follow .handle{font-family:'Bricolage Grotesque';font-weight:800;font-size:76px;letter-spacing:-2px;margin-top:14px;color:#F7F1F4}
.follow .apps{display:flex;gap:16px;margin-top:26px}
.app{display:flex;align-items:center;gap:14px;background:#262028;border-radius:999px;padding:14px 26px 14px 18px;font-size:30px;font-weight:600}
.sign{position:absolute;right:100px;top:1610px;text-align:right;font-family:'Shadows Into Light',cursive;font-size:116px;line-height:1.05;color:#FF8FB1;transform:rotate(-5deg)}
.sign small{display:block;font-family:'Shadows Into Light',cursive;font-size:60px;color:#C9BEC4;margin-bottom:4px}
.peek{position:absolute;right:-140px;top:930px;width:300px;transform:scaleX(-1) rotate(-8deg)}
</style></head><body>
<div class="glow"></div>
<div class="eyebrow">Ciao a tutti,</div>
<div class="h1">Ho lavorato<br>a <span>un’app</span>,<br>si chiama</div>
<img class="logo" src="../brand/dot/logo-mingle-per-fondo-scuro.svg" alt="mingle.">
<img class="peek" src="../brand/dot/dot-sbircia.svg" alt="">
<div class="lead">Sto iniziando a raccontarla sui social e <b>a breve sarà sugli store.</b></div>
<div class="follow">
<div class="t">Per tutti gli aggiornamenti, seguitela su</div>
<div class="handle">@mingletheapp</div>
<div class="apps">
<div class="app"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#F7F1F4" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1.1" fill="#F7F1F4" stroke="none"/></svg>Instagram</div>
<div class="app"><svg width="40" height="40" viewBox="0 0 24 24" fill="#F7F1F4"><path d="M14 3h3c.3 2.3 1.8 3.8 4 4v3c-1.5 0-2.9-.5-4-1.3V15a6 6 0 11-6-6v3.1a2.9 2.9 0 102.9 2.9H14z"/></svg>TikTok</div>
</div></div>
<div class="sign"><small>un abbraccio,</small>marika</div>
</body></html>
