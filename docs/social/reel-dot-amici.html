<!doctype html>
<html><head><meta charset="utf-8">
<!-- Reel "Si sta meglio in cerchia." — tre Dot (rosa, ambra, bianco: i colori
     della mappa) ballano insieme, si fondono in un solo Dot e si separano.
     12 s, 9:16, 120 bpm (un battito ogni 0,5 s): su Instagram si può mettere
     un audio di tendenza a quel tempo. render(t) disegna il fotogramma al
     tempo t; storia_render.js cattura i fotogrammi. Suoni: reel_dot_amici_audio.py.
     Il logo è il vettoriale di docs/brand/dot, incollato qui. -->

 background:radial-gradient(circle,rgba(255,61,127,.24) 0%,rgba(255,61,127,.07) 40%,rgba(255,61,127,0) 66%)}

  <div class="abs" id="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -1190 6273 1820" width="3764" height="1092"><title>mingle. – logo</title><g id="Scritta" fill="#F7F1F4"><path id="lettera-m" d="M26 17Q16 -15 11.5 -59.0Q7 -103 9.0 -147.0Q11 -191 19 -220Q42 -226 61.0 -251.5Q80 -277 80 -337Q80 -388 69.5 -416.5Q59 -445 46.0 -457.0Q33 -469 23 -470Q13 -503 9.5 -548.5Q6 -594 10.5 -639.0Q15 -684 27 -713Q74 -707 132.0 -703.5Q190 -700 245 -700Q314 -700 375.5 -701.5Q437 -703 476 -705Q463 -691 448.5 -657.5Q434 -624 425.5 -587.0Q417 -550 420 -522Q447 -611 521.5 -665.5Q596 -720 720 -720Q787 -720 832.0 -703.5Q877 -687 902 -637Q885 -618 868.0 -596.5Q851 -575 836 -548L861 -534Q908 -617 987.5 -668.5Q1067 -720 1160 -720Q1240 -720 1287.5 -697.0Q1335 -674 1358 -603Q1372 -562 1371.0 -519.5Q1370 -477 1365.0 -434.5Q1360 -392 1360 -350Q1360 -304 1369.0 -277.5Q1378 -251 1392.5 -238.0Q1407 -225 1421 -220Q1430 -191 1431.5 -147.0Q1433 -103 1429.0 -59.0Q1425 -15 1415 17Q1377 13 1324.0 7.5Q1271 2 1195 2Q1113 2 1050.0 7.5Q987 13 950 17Q945 -10 942.0 -54.5Q939 -99 940.5 -147.0Q942 -195 948 -230V-368H911V-230Q918 -195 919.5 -147.0Q921 -99 918.0 -54.5Q915 -10 908 17Q884 14 860.0 10.5Q836 7 805.5 4.0Q775 1 731 1Q675 1 619.5 7.0Q564 13 527 17Q522 -10 519.0 -54.5Q516 -99 517.5 -147.0Q519 -195 525 -230V-368H488V-230Q495 -195 496.5 -147.0Q498 -99 495.0 -54.5Q492 -10 485 17Q461 14 432.0 10.5Q403 7 360.5 4.5Q318 2 252 2Q184 2 125.5 7.0Q67 12 26 17Z"/><path id="lettera-i" d="M1472 17Q1464 -3 1459.0 -34.5Q1454 -66 1453.5 -101.0Q1453 -136 1455.5 -167.5Q1458 -199 1465 -219Q1480 -225 1494.0 -238.0Q1508 -251 1517.5 -277.0Q1527 -303 1527 -348Q1527 -392 1515.5 -416.5Q1504 -441 1489.5 -452.5Q1475 -464 1465 -469Q1456 -486 1452.0 -517.5Q1448 -549 1448.5 -586.0Q1449 -623 1454.0 -657.0Q1459 -691 1469 -713Q1480 -712 1488.0 -710.5Q1496 -709 1506 -708Q1502 -646 1531.0 -601.5Q1560 -557 1610.5 -538.0Q1661 -519 1718 -530Q1670 -532 1629.5 -555.5Q1589 -579 1564.5 -618.5Q1540 -658 1540 -707Q1540 -748 1559.5 -786 5Q3895 -510 3851 -510Q3811 -510 3779.0 -516.5Q3747 -523 3723 -534L3709 -509Q3727 -499 3751 -493Q3789 -482 3827.0 -479.0Q3865 -476 3898.0 -474.5Q3931 -473 3956.5 -465.0Q3982 -457 3996.5 -436.0Q4011 -415 4011 -373Q4011 -309 3960.5 -266.5Q3910 -224 3823.0 -202.5Q3736 -181 3625 -176L3626 -147Q3699 -148 3759.5 -146.0Q3820 -144 3867.0 -130.0Q3914 -116 3946.0 -83.0Q3978 -50 3994.5 9.5Q4011 69 4011 162Q3956 175 3893.5 175.5Q3831 176 3773 164Q3752 149 3714.5 148.0Q3677 147 3623.0 153.5Q3569 160 3499.0 166.5Q3429 173 3343 173ZM3509 -436H3562V-513H3509Z"/><path id="lettera-l" d="M4053 17Q4045 -3 4040.0 -34.5Q4035 -66 4034.5 -101.0Q4034 -136 4036.5 -167.5Q4039 -199 4046 -219Q4061 -225 4075.0 -239.5Q4089 -254 4098.0 -290.0Q4107 -326 4107 -393Q4107 -462 4096.5 -496.5Q4086 -531 4071.5 -544.5Q4057 -558 4046 -563Q4037 -580 4033.0 -611.5Q4029 -643 4029.5 -679.5Q4030 -716 4035.0 -749.5Q4040 -783 4050 -805Q4079 -802 4122.0 -798.5Q4165 -795 4215.5 -792.5Q4266 -790 4314 -790Q4385 -790 4443.5 -794.5Q4502 -799 4544 -803Q4553 -775 4557.0 -749.5Q4561 -724 4561 -698Q4561 -651 4551.5 -605.5Q4542 -560 4532.5 -507.5Q4523 -455 4523 -385Q4523 -322 4532.0 -288.0Q4541 -254 4555.0 -239.5Q4569 -225 4584 -219Q4593 -188 4595.0 -142.5Q4597 -97 4592.5 -53.5Q4588 -10 4577 17Q4549 14 4505.0 10.5Q4461 7 4411.0 4.5Q4361 2 4314 2Q4266 2 4216.5 4.5Q4167 7 4124.0 10.5Q4081 14 4053 17Z"/><path id="lettera-e" d="M5078 34Q4915 34 4812.5 -11.5Q4710 -57 4662.0 -142.0Q4614 -227 4614 -347Q4614 -485 4665.5 -569.0Q4717 -653 4826.0 -691.5Q4935 -730 5107 -730Q5235 -730 5335.5 -703.0Q5436 -676 5494.0 -623.5Q5552 -571 5552 -494Q5552 -466 5543.5 -437.5Q5535 -409 5509.0 -386.0Q5483 -363 5431.0 -349.0Q5379 -335 5292 -335Q5234 -335 5187.5 -336.5Q5141 -338 5102 -342H5052V-268H5101V-308Q5313 -318 5549 -308Q5549 -197 5501.0 -121.0Q5453 -45 5350.0 -5.5Q5247 34 5078 34ZM5052 -394H5101V-452H5052Z"/></g><g id="Dot"><path transform="translate(5498.71 -584.29) scale(3.1429)" d="M172.85 100.00 C172.70 111.55 165.87 124.30 159.55 134.38 C153.23 144.46 144.84 154.50 134.91 160.47 C124.99 166.43 111.69 170.07 100.00 170.17 C88.31 170.27 74.76 166.97 64.75 161.06 C54.74 155.14 45.39 144.84 39.95 134.67 C34.52 124.49 32.63 111.85 32.12 100.00 C31.62 88.15 31.55 73.85 36.94 63.60 C42.34 53.34 53.98 43.94 64.49 38.49 C75.00 33.04 88.42 30.45 100.00 30.90 C111.58 31.35 123.88 35.48 133.96 41.18 C144.04 46.88 153.98 55.29 160.47 65.09 C166.95 74.89 173.00 88.45 172.85 100.00 Z" fill="#FF3D7F"/><g id="Faccia" transform="translate(5498.71 -584.29) scale(3.1429)"><g id="Guance" fill="#FFFFFF" opacity="0.24"><ellipse cx="63" cy="110" rx="9" ry="5"/><ellipse cx="137" cy="110" rx="9" ry="5"/></g><g id="Occhi"><ellipse cx="79" cy="88" rx="8" ry="11" fill="#0D0B0E"/><circle cx="82" cy="83" r="2.6" fill="#FFFFFF"/><ellipse cx="121" cy="88" rx="8" ry="11" fill="#0D0B0E"/><circle cx="124" cy="83" r="2.6" fill="#FFFFFF"/></g><g id="Bocca"><path d="M88 119 Q100 130 112 119" fill="none" stroke="#0D0B0E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></svg></div>
  <div class="abs" id="tag">Presto, <span>nella tua città.</span></div>
  <div class="abs" id="handle">@mingletheapp</div>
</div>

<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeBack = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const bounceE = x => { const n = 7.5625, d = 2.75;
  if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75;
  if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375; return n * (x -= 2.625 / d) * x + .984375; };
const INK = '#0D0B0E', PINK = '#FF3D7F', AMBER = '#FFB547', PAPER = '#F7F1F4', BLUSH = '#FF8FB1';
const BEAT = 0.5;
const FLOOR = 1380;

// corpo "vivo" di Dot, come nell'app
function blob(t, R, seed) {
  let d = '';
  for (let i = 0; i <= 64; i++) {
    const a = i / 64 * Math.PI * 2;
    const k = 1 + .05 * (.55 * Math.sin(3 * a + t * 2.4 + seed) + .35 * Math.sin(5 * a - t * 1.9 + seed * 2) + .25 * Math.sin(2 * a + t * 1.3));
    d += (i ? 'L' : 'M') + (Math.cos(a) * R * k).toFixed(1) + ' ' + (Math.sin(a) * R * k).toFixed(1);
  }
  return d + 'Z';
}

// facce (centro 0,0; raggio 100)
const cheeks = c => `<g fill="${c}" opacity="${c === BLUSH ? .6 : .24}"><ellipse cx="-37" cy="12" rx="12" ry="7"/><ellipse cx="37" cy="12" rx="12" ry="7"/></g>`;
const FACES = {
  happy: c => cheeks(c) + `<ellipse cx="-22" cy="-14" rx="11" ry="15" fill="${INK}"/><circle cx="-18" cy="-20" r="3.6" fill="#fff"/><ellipse cx="22" cy="-14" rx="11" ry="15" fill="${INK}"/><circle cx="26" cy="-20" r="3.6" fill="#fff"/><path d="M-16 26Q0 42 16 26" stroke="${INK}" stroke-width="8" fill="none" stroke-linecap="round"/>`,
  laugh: c => cheeks(c) + `<path d="M-44 -4L-30 -20L-16 -4" stroke="${INK}" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 -4L30 -20L44 -4" stroke="${INK}" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M-24 16Q0 56 24 16Z" fill="${INK}"/><ellipse cx="5" cy="36" rx="10" ry="7" fill="${BLUSH}"/>`,
  wink: c => cheeks(c) + `<ellipse cx="-22" cy="-14" rx="11" ry="15" fill="${INK}"/><circle cx="-18" cy="-20" r="3.6" fill="#fff"/><path d="M10 -12Q24 -26 38 -12" stroke="${INK}" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M-16 24Q0 40 16 24" stroke="${INK}" stroke-width="8" fill="none" stroke-linecap="round"/>`,
  love: c => cheeks(c) + `<path transform="translate(-24 -12) scale(1.7)" d="M0 9C-16-2-12-16 0-8C12-16 16-2 0 9Z" fill="${INK}"/><path transform="translate(24 -12) scale(1.7)" d="M0 9C-16-2-12-16 0-8C12-16 16-2 0 9Z" fill="${INK}"/><path d="M-20 26Q0 44 20 26" stroke="${INK}" stroke-width="8" fill="none" stroke-linecap="round"/>`,
  shades: c => cheeks(c) + `<rect x="-52" y="-30" width="46" height="32" rx="14" fill="${INK}"/><rect x="6" y="-30" width="46" height="32" rx="14" fill="${INK}"/><path d="M-6 -16H6" stroke="${INK}" stroke-width="6"/><path d="M-42 -18l8-7M16 -18l8-7" stroke="#fff" stroke-width="4.5" stroke-linecap="round" opacity=".8"/><path d="M-24 16Q0 52 24 16Z" fill="${INK}"/>`,
};

// i tre amici: ambra a sinistra, rosa al centro, bianco a destra
const DOTS = [
  { c: AMBER, x: 225, R: 128, seed: 1.1, phase: 0, enter: 1.0, from: -300, cheek: '#fff' },
  { c: PINK, x: 540, R: 148, seed: 0.3, phase: .5, enter: .15, from: 0, cheek: '#fff' },
  { c: PAPER, x: 855, R: 124, seed: 2.2, phase: 1, enter: 1.5, from: 1380, cheek: BLUSH },
];
// coreografia delle facce per battito
function faceFor(i, t) {
  const b = Math.floor(t / BEAT);
  if (t > 7.0) return ['wink', 'laugh', 'love'][i];
  if (t > 3.9 && t < 4.6) return 'shades';
  return [['happy', 'laugh'], ['laugh', 'happy'], ['happy', 'love']][i][b % 2];
}

const MERGE_A = 5.4, MERGE_B = 6.0, SPLIT_A = 6.7, SPLIT_B = 7.1, ENDT = 9.0;

function render(t) {
  // fasci di luce
  let beams = '';
  [[200, PINK, 0], [540, PAPER, 1.7], [880, AMBER, 3.1]].forEach(([x, c, s]) => {
    const ang = Math.sin(t * .9 + s) * 18;
    const pulse = .25 + .25 * Math.max(0, Math.cos((t % BEAT) / BEAT * Math.PI));
    beams += `<g transform="translate(${x} -40) rotate(${ang})" opacity="${pulse}"><path d="M-20 0L20 0L240 1500L-240 1500Z" fill="${c}" opacity=".35"/><path d="M-20 0L20 0L240 1500L-240 1500Z" fill="url(#beam)" opacity=".25"/></g>`;
  });
  $('beams').innerHTML = beams;

  // fusione: tutti verso il centro, poi un solo Dot grande, poi di nuovo tre
  const m = easeInOut(seg(t, MERGE_A, MERGE_B)) * (1 - easeOut(seg(t, SPLIT_A, SPLIT_B)));
  const merged = t >= MERGE_B && t < SPLIT_A;
  const big = Math.sin(seg(t, MERGE_B - .1, SPLIT_A) * Math.PI);

  let bodies = '', faces = '', shadows = '';
  DOTS.forEach((d, i) => {
    // ingresso (rimbalzo dal lato o dal basso)
    const e = easeBack(seg(t, d.enter, d.enter + .5));
    let x = d.from === 0 ? d.x : d.from + (d.x - d.from) * e;
    const beatPos = ((t + d.phase * .12) % BEAT) / BEAT;
    let hop = Math.abs(Math.sin(beatPos * Math.PI)) * 70;
    // ogni 4 battute un salto più alto, tutti insieme
    if (Math.floor(t / BEAT) % 8 === 7) hop *= 2.2;
    const lean = Math.sin((t / BEAT + i) * Math.PI / 2) * 12;
    let y = FLOOR - d.R - (t < d.enter ? (d.from === 0 ? (1 - e) * -400 : 0) : hop);
    if (d.from === 0 && t < .65) y = FLOOR - d.R - (1 - easeBack(seg(t, .15, .65))) * 600;
    // verso il centro per la fusione
    x = x + (540 - x) * m;
    y = y + (FLOOR - 230 - y) * m;
    const squash = 1 + .14 * Math.max(0, Math.cos(beatPos * Math.PI));
    const R = d.R * (1 - .25 * m);
    if (t >= d.enter - .01) {
      bodies += `<g transform="translate(${x} ${y}) rotate(${lean * (1 - m)}) scale(${squash} ${2 - squash})"><path d="${blob(t, R, d.seed)}" fill="${merged ? PINK : d.c}"/></g>`;
      shadows += `<ellipse cx="${x}" cy="${FLOOR + 8}" rx="${R * .8}" ry="16" fill="#000" opacity="${.45 - hop / 400}"/>`;
      if (!merged && m < .6) {
        const s = R / 100;
        faces += `<g transform="translate(${x} ${y - 6}) rotate(${lean * (1 - m)}) scale(${s * squash} ${s * (2 - squash)})" opacity="${1 - m / .6}">${FACES[faceFor(i, t)](d.cheek)}</g>`;
      }
    }
  });
  if (m > .5) {
    // il Dot "di gruppo": grande, che ride
    const R = 200 + 50 * big;
    const wob = 1 + .06 * Math.sin(t * 18) * big;
    bodies += `<g transform="translate(540 ${FLOOR - R}) scale(${wob} ${2 - wob})"><path d="${blob(t, R, .9)}" fill="${PINK}"/></g>`;
    faces += `<g transform="translate(540 ${FLOOR - R - 6}) scale(${R / 100})" opacity="${seg(m, .6, 1)}">${FACES.laugh('#fff')}</g>`;
  }
  $('bodies').innerHTML = bodies; $('faces').innerHTML = faces; $('shadows').innerHTML = shadows;
  // l'effetto "goccia che si fonde" solo durante la fusione: prima e dopo i
  // tre Dot restano ben separati anche quando ballano vicini
  if (t > MERGE_A - .1 && t < SPLIT_B + .25) $('bodies').setAttribute('filter', 'url(#goo)');
  else $('bodies').removeAttribute('filter');

  // coriandoli al finale
  let conf = '';
  if (t > SPLIT_A) {
    const cols = [PINK, AMBER, PAPER];
    for (let k = 0; k < 40; k++) {
      const u = t - SPLIT_A - k * .015;
      if (u < 0) continue;
      const a = (k * 137.5) * Math.PI / 180, v = 700 + (k % 7) * 90;
      const cx = 540 + Math.cos(a) * v * u, cy = FLOOR - 300 - Math.sin(a) * v * u * .9 + 900 * u * u;
      conf += `<rect x="${cx}" y="${cy}" width="22" height="12" rx="3" fill="${cols[k % 3]}" transform="rotate(${k * 40 + u * 400} ${cx} ${cy})" opacity="${1 - seg(u, 1.2, 1.8)}"/>`;
    }
  }
  $('confetti').innerHTML = conf;

  // testo
  const c = easeOut(seg(t, 2.2, 2.7));
  $('cap').style.opacity = c * (1 - seg(t, ENDT - .2, ENDT));
  $('cap').style.transform = `translateY(${(1 - c) * 30}px)`;

  // finale: logo
  $('end').style.opacity = seg(t, ENDT, ENDT + .35);
  letters.forEach((el, i) => {
    const p = seg(t, ENDT + .45 + i * .08, ENDT + .8 + i * .08);
    tf(el, LB[i], 0, (1 - easeOut(p)) * 260, .2 + .8 * easeBack(p), (1 - p) * -12);
    el.style.opacity = p > 0 ? 1 : 0;
  });
  const dp = seg(t, ENDT + 1.05, ENDT + 1.75);
  const sq = dp > .36 && dp < .5 ? 1 - Math.sin((dp - .36) / .14 * Math.PI) * .18 : 1;
  tf(ldot, DB, 0, (1 - bounceE(dp)) * -900, 1);
  ldot.setAttribute('transform', ldot.getAttribute('transform') + ` translate(${DB.cx} ${DB.cy + DB.h / 2}) scale(${1 / sq} ${sq}) translate(${-DB.cx} ${-DB.cy - DB.h / 2})`);
  ldot.style.opacity = dp > 0 ? 1 : 0;
  const g = easeOut(seg(t, ENDT + 1.6, ENDT + 2.0));
  $('tag').style.opacity = g; $('tag').style.transform = `translateY(${(1 - g) * 24}px)`;
  $('handle').style.opacity = easeOut(seg(t, ENDT + 1.9, ENDT + 2.3));
}

const lsvg = document.querySelector('#logo svg');
const letters = [...lsvg.querySelectorAll('#Scritta path')];
const ldot = lsvg.querySelector('#Dot');
const box = el => { const b = el.getBBox(); return { cx: b.x + b.width / 2, cy: b.y + b.height / 2, h: b.height }; };
const LB = letters.map(box), DB = box(ldot);
const tf = (el, b, dx, dy, s, r = 0) => el.setAttribute('transform', `translate(${b.cx + dx} ${b.cy + dy}) rotate(${r}) scale(${s}) translate(${-b.cx} ${-b.cy})`);

window.ready = document.fonts.ready.then(() => render(0));
</script>
</body></html>
