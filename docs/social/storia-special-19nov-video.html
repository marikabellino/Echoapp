3895 -510 3851 -510Q3811 -510 3779.0 -516.5Q3747 -523 3723 -534L3709 -509Q3727 -499 3751 -493Q3789 -482 3827.0 -479.0Q3865 -476 3898.0 -474.5Q3931 -473 3956.5 -465.0Q3982 -457 3996.5 -436.0Q4011 -415 4011 -373Q4011 -309 3960.5 -266.5Q3910 -224 3823.0 -202.5Q3736 -181 3625 -176L3626 -147Q3699 -148 3759.5 -146.0Q3820 -144 3867.0 -130.0Q3914 -116 3946.0 -83.0Q3978 -50 3994.5 9.5Q4011 69 4011 162Q3956 175 3893.5 175.5Q3831 176 3773 164Q3752 149 3714.5 148.0Q3677 147 3623.0 153.5Q3569 160 3499.0 166.5Q3429 173 3343 173ZM3509 -436H3562V-513H3509Z"/><path id="lettera-l" d="M4053 17Q4045 -3 4040.0 -34.5Q4035 -66 4034.5 -101.0Q4034 -136 4036.5 -167.5Q4039 -199 4046 -219Q4061 -225 4075.0 -239.5Q4089 -254 4098.0 -290.0Q4107 -326 4107 -393Q4107 -462 4096.5 -496.5Q4086 -531 4071.5 -544.5Q4057 -558 4046 -563Q4037 -580 4033.0 -611.5Q4029 -643 4029.5 -679.5Q4030 -716 4035.0 -749.5Q4040 -783 4050 -805Q4079 -802 4122.0 -798.5Q4165 -795 4215.5 -792.5Q4266 -790 4314 -790Q4385 -790 4443.5 -794.5Q4502 -799 4544 -803Q4553 -775 4557.0 -749.5Q4561 -724 4561 -698Q4561 -651 4551.5 -605.5Q4542 -560 4532.5 -507.5Q4523 -455 4523 -385Q4523 -322 4532.0 -288.0Q4541 -254 4555.0 -239.5Q4569 -225 4584 -219Q4593 -188 4595.0 -142.5Q4597 -97 4592.5 -53.5Q4588 -10 4577 17Q4549 14 4505.0 10.5Q4461 7 4411.0 4.5Q4361 2 4314 2Q4266 2 4216.5 4.5Q4167 7 4124.0 10.5Q4081 14 4053 17Z"/><path id="lettera-e" d="M5078 34Q4915 34 4812.5 -11.5Q4710 -57 4662.0 -142.0Q4614 -227 4614 -347Q4614 -485 4665.5 -569.0Q4717 -653 4826.0 -691.5Q4935 -730 5107 -730Q5235 -730 5335.5 -703.0Q5436 -676 5494.0 -623.5Q5552 -571 5552 -494Q5552 -466 5543.5 -437.5Q5535 -409 5509.0 -386.0Q5483 -363 5431.0 -349.0Q5379 -335 5292 -335Q5234 -335 5187.5 -336.5Q5141 -338 5102 -342H5052V-268H5101V-308Q5313 -318 5549 -308Q5549 -197 5501.0 -121.0Q5453 -45 5350.0 -5.5Q5247 34 5078 34ZM5052 -394H5101V-452H5052Z"/></g><g id="Dot"><path transform="translate(5498.71 -584.29) scale(3.1429)" d="M172.85 100.00 C172.70 111.55 165.87 124.30 159.55 134.38 C153.23 144.46 144.84 154.50 134.91 160.47 C124.99 166.43 111.69 170.07 100.00 170.17 C88.31 170.27 74.76 166.97 64.75 161.06 C54.74 155.14 45.39 144.84 39.95 134.67 C34.52 124.49 32.63 111.85 32.12 100.00 C31.62 88.15 31.55 73.85 36.94 63.60 C42.34 53.34 53.98 43.94 64.49 38.49 C75.00 33.04 88.42 30.45 100.00 30.90 C111.58 31.35 123.88 35.48 133.96 41.18 C144.04 46.88 153.98 55.29 160.47 65.09 C166.95 74.89 173.00 88.45 172.85 100.00 Z" fill="#FF3D7F"/><g id="Faccia" transform="translate(5498.71 -584.29) scale(3.1429)"><g id="Guance" fill="#FFFFFF" opacity="0.24"><ellipse cx="63" cy="110" rx="9" ry="5"/><ellipse cx="137" cy="110" rx="9" ry="5"/></g><g id="Occhi"><ellipse cx="79" cy="88" rx="8" ry="11" fill="#0D0B0E"/><circle cx="82" cy="83" r="2.6" fill="#FFFFFF"/><ellipse cx="121" cy="88" rx="8" ry="11" fill="#0D0B0E"/><circle cx="124" cy="83" r="2.6" fill="#FFFFFF"/></g><g id="Bocca"><path d="M88 119 Q100 130 112 119" fill="none" stroke="#0D0B0E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></svg></div>

</div>
<div class="abs" id="flash"></div>

<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeBack = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const bounce = x => { const n = 7.5625, d = 2.75;
  if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75;
  if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375; return n * (x -= 2.625 / d) * x + .984375; };

// Tempi chiave (gli stessi usati dall'audio)
const K = { dotIn: .15, glassesFrom: 1.55, glassesLand: 2.05, flip: 2.45, g1: 2.7, c1: 3.4, toLogo: 4.9, letters: 5.25, dotDrop: 5.85, handle: 6.6 };

function palm(x, base, h, lean, s) {
  const tx = x + lean, ty = base - h;
  let d = `M${x - 14 * s} ${base} Q${x + lean * .3} ${base - h * .5} ${tx - 6 * s} ${ty} L${tx + 6 * s} ${ty} Q${x + lean * .3 + 16 * s} ${base - h * .5} ${x + 14 * s} ${base}Z`;
  for (const [a, k] of [[-170, 1], [-140, .9], [-110, .8], [-60, .85], [-25, .95], [5, 1], [-85, .7]]) {
    const r = a * Math.PI / 180, L = 230 * s * k;
    const ex = tx + Math.cos(r) * L, ey = ty + Math.sin(r) * L * .55 + L * .35;
    const mx = tx + Math.cos(r) * L * .5, my = ty + Math.sin(r) * L * .5 - 30 * s;
    d += `M${tx} ${ty} Q${mx} ${my - 18 * s} ${ex} ${ey} Q${mx} ${my + 22 * s} ${tx} ${ty + 8 * s}Z`;
  }
  return `<path d="${d}"/>`;
}
$('palms').innerHTML = palm(110, 1400, 820, 60, 1.25) + palm(240, 1400, 560, 30, .85) + palm(970, 1400, 880, -70, 1.3) + palm(860, 1400, 520, -25, .8);
let st = ''; for (let i = 0; i < 7; i++) st += `<rect x="0" y="${1210 + i * 46}" width="1080" height="${6 + i * 4}"/>`;
$('stripes').innerHTML = st;
function grid(t) {
  const hz = 1380, vx = 540; let g = '';
  for (let i = -12; i <= 12; i++) g += `<line x1="${vx + i * 40}" y1="${hz}" x2="${vx + i * 260}" y2="1920"/>`;
  const sp = (t * .9) % 1;
  for (let k = 0; k < 12; k++) { const z = k + 1 - sp; const y = hz + 900 / (z + .6) - 900 / 12.6; if (y > hz && y < 1920) g += `<line x1="0" y1="${y}" x2="1080" y2="${y}"/>`; }
  $('grid').innerHTML = g;
}

// Logo: lettere e Dot animati singolarmente
const svg = document.querySelector('#logo svg');
const letters = [...svg.querySelectorAll('#Scritta path')];
const ldot = svg.querySelector('#Dot');
const box = el => { const b = el.getBBox(); return { cx: b.x + b.width / 2, cy: b.y + b.height / 2, h: b.height }; };
const LB = letters.map(box), DB = box(ldot);
const tf = (el, b, dx, dy, s, r = 0) => el.setAttribute('transform',
  `translate(${b.cx + dx} ${b.cy + dy}) rotate(${r}) scale(${s}) translate(${-b.cx} ${-b.cy})`);

function render(t) {
  // 1
  const a = i => easeOut(seg(t, .1 + i * .18, .55 + i * .18));
  [['eb', 0], ['h1', 1]].forEach(([id, i]) => { $(id).style.opacity = a(i); $(id).style.transform = `translateY(${(1 - a(i)) * 40}px)`; });
  const pad = easeBack(seg(t, .3, .8));
  const mash = Math.floor(t * 9) % 2;
  $('bA').setAttribute('r', mash ? 10 : 13); $('bB').setAttribute('r', mash ? 13 : 10);
  $('pad').style.opacity = clamp(pad) * (1 - seg(t, K.flip - .2, K.flip));
  $('pad').style.transform = `translateY(${(1 - pad) * 80 + (mash ? 3 : 0)}px)`;
  $('s1').style.opacity = 1 - seg(t, K.flip - .05, K.flip + .05);

  // Dot
  const din = easeBack(seg(t, K.dotIn, K.dotIn + .5));
  let dy = 0, dr = 0;
  if (t < K.flip) { dr = Math.sin(t * 9) * 4; dy = Math.sin(t * 18) * 3; }
  else { const b = (t - K.flip) * 2; dy = -Math.abs(Math.sin(b * Math.PI)) * 34; dr = Math.sin(b * Math.PI) * 6; }
  const out = seg(t, K.toLogo, K.toLogo + .3);
  $('dotwrap').style.opacity = 1 - out;
  $('dotwrap').style.transform = `translateY(${dy - out * 60}px) rotate(${dr}deg) scale(${din * (1 + .06 * seg(t, K.flip, K.flip + .4))})`;
  const fall = bounce(seg(t, K.glassesFrom, K.glassesLand + .25));
  $('shades').style.opacity = t > K.glassesFrom ? 1 : 0;
  $('sh').setAttribute('transform', `translate(0 ${(1 - fall) * -200})`);

  // flash unico al cambio scena
  $('flash').style.opacity = .85 * seg(t, K.flip - .1, K.flip) * (1 - seg(t, K.flip, K.flip + .4));

  // 2
  $('s2').style.opacity = seg(t, K.flip - .05, K.flip + .05) * (1 - out);
  grid(t);
  $('sunc').setAttribute('cy', 1180 - 50 * easeOut(seg(t, K.flip, K.toLogo)));
  const c = easeOut(seg(t, K.c1, K.c1 + .4));
  $('c1').style.opacity = c; $('c1').style.transform = `skewX(-8deg) translateY(${(1 - c) * 30}px)`;

  // 3 · logo
  $('s3').style.opacity = out;
  letters.forEach((el, i) => {
    const p = seg(t, K.letters + i * .08, K.letters + i * .08 + .35);
    tf(el, LB[i], 0, (1 - easeOut(p)) * 260, .2 + .8 * easeBack(p), (1 - p) * -12);
    el.style.opacity = p > 0 ? 1 : 0;
  });
  const dp = seg(t, K.dotDrop, K.dotDrop + .7);
  const sq = dp > .36 && dp < .5 ? 1 - Math.sin((dp - .36) / .14 * Math.PI) * .18 : 1;
  tf(ldot, DB, 0, (1 - bounce(dp)) * -900, 1);
  ldot.setAttribute('transform', ldot.getAttribute('transform') + ` translate(${DB.cx} ${DB.cy + DB.h / 2}) scale(${1 / sq} ${sq}) translate(${-DB.cx} ${-DB.cy - DB.h / 2})`);
  ldot.style.opacity = dp > 0 ? 1 : 0;
  const h = easeOut(seg(t, K.handle, K.handle + .4));
  $('handle').style.opacity = h; $('handle').style.transform = `translateY(${(1 - h) * 20}px)`;
}
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.complete ? 1 : new Promise(r => i.onload = r))]).then(() => render(0));
</script>
