<html><head><meta charset="utf-8">
<!-- Reel "Ogni angolo della tua città ha una storia." (12 s, 9:16).
     render(t) disegna il fotogramma al tempo t; storia_render.js cattura i
     fotogrammi (durata passata con ?d=12). I salti di Dot cadono ogni 1 s
     (due battute a 120 bpm): su Instagram si può aggiungere un audio di
     tendenza a quel tempo. Effetti sonori: reel_citta_audio.py.
     Il logo è il vettoriale di docs/brand/dot, incollato qui. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#141016;color:#F7F1F4;font-family:Inter,sans-serif;position:relative}
.abs{position:absolute}
#world{left:0;top:0;width:1600px;height:2600px;transform-origin:0 0}
#cap{left:70px;right:70px;top:250px;text-align:left}
#cap .t{font-family:'Bricolage Grotesque';font-weight:800;font-size:78px;line-height:1.02;letter-spacing:-3px;

#cap2{left:70px;right:70px;top:250px;font-family:'Bricolage Grotesque';font-weight:800;font-size:78px;line-height:1.02;letter-spacing:-3px;opacity:0;
 text-shadow:0 4px 24px rgba(13,11,14,.9)}
#cap2 span{color:#FF3D7F}
.card{position:absolute;width:520px;margin-left:-260px;background:#F7F1F4;color:#0D0B0E;border-radius:36px;padding:26px 30px 28px;
 box-shadow:0 30px 60px -20px rgba(0,0,0,.7);transform-origin:50% 110%}
.card .who{display:flex;align-items:center;gap:12px;font-family:'DM Mono';font-size:22px;letter-spacing:2px;color:#6B6067;text-transform:uppercase}
.card .who i{width:22px;height:22px;border-radius:50%;display:inline-block}
.card .txt{font-family:'Bricolage Grotesque';font-weight:800;font-size:50px;line-height:1.02;letter-spacing:-1.5px;margin-top:12px}
.card:after{content:'';position:absolute;left:50%;bottom:-16px;margin-left:-18px;width:36px;height:36px;background:#F7F1F4;border-radius:6px;transform:rotate(45deg)}
#dot{width:170px;height:170px;margin:-150px 0 0 -85px}

#end{inset:0;background:#0D0B0E;opacity:0}
#endglow{left:540px;top:900px;width:1200px;height:1200px;margin:-600px 0 0 -600px;border-radius:50%;

#logo{left:110px;top:780px;width:860px}
#logo svg{width:860px;height:auto;overflow:visible}
#tag{left:0;width:1080px;top:1090px;text-align:center;font-family:'Bricolage Grotesque';font-weight:700;font-size:58px;letter-spacing:-1.5px}
#tag span{color:#FF3D7F}
#handle{left:0;width:1080px;top:1190px;text-align:center;font-family:'DM Mono';font-size:32px;letter-spacing:5px;color:#C9BEC4}

5Q3895 -510 3851 -510Q3811 -510 3779.0 -516.5Q3747 -523 3723 -534L3709 -509Q3727 -499 3751 -493Q3789 -482 3827.0 -479.0Q3865 -476 3898.0 -474.5Q3931 -473 3956.5 -465.0Q3982 -457 3996.5 -436.0Q4011 -415 4011 -373Q4011 -309 3960.5 -266.5Q3910 -224 3823.0 -202.5Q3736 -181 3625 -176L3626 -147Q3699 -148 3759.5 -146.0Q3820 -144 3867.0 -130.0Q3914 -116 3946.0 -83.0Q3978 -50 3994.5 9.5Q4011 69 4011 162Q3956 175 3893.5 175.5Q3831 176 3773 164Q3752 149 3714.5 148.0Q3677 147 3623.0 153.5Q3569 160 3499.0 166.5Q3429 173 3343 173ZM3509 -436H3562V-513H3509Z"/><path id="lettera-l" d="M4053 17Q4045 -3 4040.0 -34.5Q4035 -66 4034.5 -101.0Q4034 -136 4036.5 -167.5Q4039 -199 4046 -219Q4061 -225 4075.0 -239.5Q4089 -254 4098.0 -290.0Q4107 -326 4107 -393Q4107 -462 4096.5 -496.5Q4086 -531 4071.5 -544.5Q4057 -558 4046 -563Q4037 -580 4033.0 -611.5Q4029 -643 4029.5 -679.5Q4030 -716 4035.0 -749.5Q4040 -783 4050 -805Q4079 -802 4122.0 -798.5Q4165 -795 4215.5 -792.5Q4266 -790 4314 -790Q4385 -790 4443.5 -794.5Q4502 -799 4544 -803Q4553 -775 4557.0 -749.5Q4561 -724 4561 -698Q4561 -651 4551.5 -605.5Q4542 -560 4532.5 -507.5Q4523 -455 4523 -385Q4523 -322 4532.0 -288.0Q4541 -254 4555.0 -239.5Q4569 -225 4584 -219Q4593 -188 4595.0 -142.5Q4597 -97 4592.5 -53.5Q4588 -10 4577 17Q4549 14 4505.0 10.5Q4461 7 4411.0 4.5Q4361 2 4314 2Q4266 2 4216.5 4.5Q4167 7 4124.0 10.5Q4081 14 4053 17Z"/><path id="lettera-e" d="M5078 34Q4915 34 4812.5 -11.5Q4710 -57 4662.0 -142.0Q4614 -227 4614 -347Q4614 -485 4665.5 -569.0Q4717 -653 4826.0 -691.5Q4935 -730 5107 -730Q5235 -730 5335.5 -703.0Q5436 -676 5494.0 -623.5Q5552 -571 5552 -494Q5552 -466 5543.5 -437.5Q5535 -409 5509.0 -386.0Q5483 -363 5431.0 -349.0Q5379 -335 5292 -335Q5234 -335 5187.5 -336.5Q5141 -338 5102 -342H5052V-268H5101V-308Q5313 -318 5549 -308Q5549 -197 5501.0 -121.0Q5453 -45 5350.0 -5.5Q5247 34 5078 34ZM5052 -394H5101V-452H5052Z"/></g><g id="Dot"><path transform="translate(5498.71 -584.29) scale(3.1429)" d="M172.85 100.00 C172.70 111.55 165.87 124.30 159.55 134.38 C153.23 144.46 144.84 154.50 134.91 160.47 C124.99 166.43 111.69 170.07 100.00 170.17 C88.31 170.27 74.76 166.97 64.75 161.06 C54.74 155.14 45.39 144.84 39.95 134.67 C34.52 124.49 32.63 111.85 32.12 100.00 C31.62 88.15 31.55 73.85 36.94 63.60 C42.34 53.34 53.98 43.94 64.49 38.49 C75.00 33.04 88.42 30.45 100.00 30.90 C111.58 31.35 123.88 35.48 133.96 41.18 C144.04 46.88 153.98 55.29 160.47 65.09 C166.95 74.89 173.00 88.45 172.85 100.00 Z" fill="#FF3D7F"/><g id="Faccia" transform="translate(5498.71 -584.29) scale(3.1429)"><g id="Guance" fill="#FFFFFF" opacity="0.24"><ellipse cx="63" cy="110" rx="9" ry="5"/><ellipse cx="137" cy="110" rx="9" ry="5"/></g><g id="Occhi"><ellipse cx="79" cy="88" rx="8" ry="11" fill="#0D0B0E"/><circle cx="82" cy="83" r="2.6" fill="#FFFFFF"/><ellipse cx="121" cy="88" rx="8" ry="11" fill="#0D0B0E"/><circle cx="124" cy="83" r="2.6" fill="#FFFFFF"/></g><g id="Bocca"><path d="M88 119 Q100 130 112 119" fill="none" stroke="#0D0B0E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></svg></div>

<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeBack = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const bounce = x => { const n = 7.5625, d = 2.75;
  if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75;
  if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375; return n * (x -= 2.625 / d) * x + .984375; };
const rnd = (s => () => (s = (s * 16807) % 2147483647) / 2147483647)(42);

const PINK = '#FF3D7F', AMBER = '#FFB547', PAPER = '#F7F1F4', INK = '#0D0B0E';

// ── mappa: strade, parchi, acqua ──
let m = '<rect width="1600" height="2600" fill="#141016"/>';
m += '<path d="M-50 1900 C300 1800 500 2050 900 1950 S1500 1850 1700 1980 L1700 2700 L-50 2700Z" fill="#12202A"/>';
for (const [x, y, w, h] of [[180, 420, 260, 200], [1050, 900, 300, 240], [300, 1500, 220, 260], [1150, 2150, 260, 180]])
  m += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="60" fill="#16241E"/>`;
m += '<g fill="none" stroke="#231C26" stroke-linecap="round">';
for (let i = 0; i < 9; i++) { const y = 120 + i * 290 + rnd() * 60; m += `<path d="M-40 ${y} C400 ${y + 60 - rnd() * 120} 1000 ${y - 40 + rnd() * 80} 1640 ${y + rnd() * 50}" stroke-width="${10 + rnd() * 22}"/>`; }
for (let i = 0; i < 7; i++) { const x = 80 + i * 240 + rnd() * 60; m += `<path d="M${x} -40 C${x + 40 - rnd() * 80} 900 ${x - 60 + rnd() * 120} 1700 ${x + rnd() * 50} 2640" stroke-width="${10 + rnd() * 20}"/>`; }
m += '</g>';
$('map').innerHTML = m;

// ── i sei ricordi (posizioni nella mappa) ──
const MEM = [
  { x: 520, y: 1180, c: PINK, who: 'cerchia', txt: 'qui il primo bacio' },
  { x: 980, y: 1000, c: AMBER, who: 'pubblico', txt: 'la pizza più buona (fidati)' },
  { x: 1180, y: 1420, c: PINK, who: 'cerchia', txt: 'ho perso le chiavi. di nuovo.' },
  { x: 760, y: 1640, c: PAPER, who: 'tuo', txt: 'ci siamo conosciuti qui' },
  { x: 420, y: 1440, c: AMBER, who: 'pubblico', txt: 'tramonto top alle 19:12' },
  { x: 880, y: 1300, c: PINK, who: 'cerchia', txt: 'ballato fino alle 5' },
];
const START = { x: 760, y: 1080 };
const L0 = 1.5, HOP = 1.0, ZOOM = 7.4, ENDT = 9.0;
const land = k => L0 + k * HOP;

// pin a forma di goccia
const pinSvg = (c, s = 1) => `<svg width="${64 * s}" height="${80 * s}" viewBox="0 0 64 80" style="position:absolute;left:${-32 * s}px;top:${-76 * s}px;overflow:visible"><path d="M32 4C49 4 60 16 60 31C60 50 32 76 32 76C32 76 4 50 4 31C4 16 15 4 32 4Z" fill="${c}"/><circle cx="25" cy="30" r="3.4" fill="${INK}"/><circle cx="39" cy="30" r="3.4" fill="${INK}"/><path d="M26 40Q32 45 38 40" stroke="${INK}" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
let ph = '', ch = '';
MEM.forEach((p, k) => {
  ph += `<div class="abs pin" id="pin${k}" style="left:${p.x}px;top:${p.y}px">${pinSvg(p.c)}</div>`;
  ch += `<div class="card" id="card${k}" style="left:${p.x}px;top:${p.y - 330}px"><div class="who"><i style="background:${p.c};${p.c === PAPER ? 'box-shadow:inset 0 0 0 2px #0D0B0E' : ''}"></i>${p.who}</div><div class="txt">${p.txt}</div></div>`;
});
// pin di sfondo che compaiono quando la mappa si allarga
const BG = [];
for (let i = 0; i < 34; i++) BG.push({ x: 120 + rnd() * 1360, y: 260 + rnd() * 2100, c: [PINK, AMBER, PAPER][i % 3], d: rnd() * .9 });
BG.forEach((p, i) => { ph += `<div class="abs pin bg" id="bg${i}" style="left:${p.x}px;top:${p.y}px">${pinSvg(p.c, .8)}</div>`; });
$('pins').innerHTML = ph; $('cards').innerHTML = ch;

// ── Dot ──
const BLOB = 'M172.85 100.00 C172.70 111.55 165.87 124.30 159.55 134.38 C153.23 144.46 144.84 154.50 134.91 160.47 C124.99 166.43 111.69 170.07 100.00 170.17 C88.31 170.27 74.76 166.97 64.75 161.06 C54.74 155.14 45.39 144.84 39.95 134.67 C34.52 124.49 32.63 111.85 32.12 100.00 C31.62 88.15 31.55 73.85 36.94 63.60 C42.34 53.34 53.98 43.94 64.49 38.49 C75.00 33.04 88.42 30.45 100.00 30.90 C111.58 31.35 123.88 35.48 133.96 41.18 C144.04 46.88 153.98 55.29 160.47 65.09 C166.95 74.89 173.00 88.45 172.85 100.00 Z';
const FACE_HAPPY = `<g fill="#fff" opacity=".24"><ellipse cx="63" cy="110" rx="9" ry="5"/><ellipse cx="137" cy="110" rx="9" ry="5"/></g><ellipse cx="79" cy="88" rx="8" ry="11" fill="${INK}"/><circle cx="82" cy="83" r="2.6" fill="#fff"/><ellipse cx="121" cy="88" rx="8" ry="11" fill="${INK}"/><circle cx="124" cy="83" r="2.6" fill="#fff"/><path d="M88 119Q100 130 112 119" stroke="${INK}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
const FACE_LAUGH = `<g fill="#fff" opacity=".24"><ellipse cx="63" cy="110" rx="9" ry="5"/><ellipse cx="137" cy="110" rx="9" ry="5"/></g><path d="M68 96L78 85L88 96" stroke="${INK}" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M112 96L122 85L132 96" stroke="${INK}" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M82 112Q100 142 118 112Z" fill="${INK}"/><ellipse cx="104" cy="127" rx="7" ry="5" fill="#FF8FB1"/>`;

// Logo animato (lettere + Dot che cade nel punto)
const lsvg = document.querySelector('#logo svg');
const letters = [...lsvg.querySelectorAll('#Scritta path')];
const ldot = lsvg.querySelector('#Dot');
const box = el => { const b = el.getBBox(); return { cx: b.x + b.width / 2, cy: b.y + b.height / 2, h: b.height }; };
const LB = letters.map(box), DB = box(ldot);
const tf = (el, b, dx, dy, s, r = 0) => el.setAttribute('transform', `translate(${b.cx + dx} ${b.cy + dy}) rotate(${r}) scale(${s}) translate(${-b.cx} ${-b.cy})`);

function dotPos(t) {
  // prima del primo salto: Dot entra dal basso
  if (t < land(0) - HOP / 2) {
    const e = easeBack(seg(t, .2, .9));
    return { x: START.x, y: START.y + (1 - e) * 500, air: 0, squash: 0 };
  }
  for (let k = 0; k < MEM.length; k++) {
    const a = land(k) - HOP / 2, b = land(k);
    const from = k === 0 ? START : MEM[k - 1];
    if (t < a) return { x: from.x, y: from.y, air: 0, squash: 0 };
    if (t < b) {
      const u = (t - a) / (b - a), e = easeInOut(u);
      return { x: from.x + (MEM[k].x - from.x) * e, y: from.y + (MEM[k].y - from.y) * e - Math.sin(u * Math.PI) * 230, air: Math.sin(u * Math.PI), squash: 0 };
    }
    if (t < land(k) + .25) return { x: MEM[k].x, y: MEM[k].y, air: 0, squash: Math.sin(seg(t, b, b + .25) * Math.PI) };
  }
  const last = MEM[MEM.length - 1];
  return { x: last.x, y: last.y, air: 0, squash: 0 };
}

function render(t) {
  const P = dotPos(t);
  // camera: segue Dot, poi si allarga sulla città
  const z = 1 - .325 * easeInOut(seg(t, ZOOM, ZOOM + 1.2));
  const camX = P.x + (800 - P.x) * easeInOut(seg(t, ZOOM, ZOOM + 1.2));
  const camY = (P.y - 120) + (1300 - (P.y - 120)) * easeInOut(seg(t, ZOOM, ZOOM + 1.2));
  $('world').style.transform = `translate(${540 - camX * z}px, ${1060 - camY * z}px) scale(${z})`;

  // Dot
  const laughing = MEM.some((_, k) => t >= land(k) && t < land(k) + .7);
  $('body').innerHTML = `<path d="${BLOB}" fill="${PINK}"/>` + (laughing ? FACE_LAUGH : FACE_HAPPY);
  const sq = P.squash * .22;
  $('body').setAttribute('transform', `translate(100 170) rotate(${P.air * 10 * Math.sin(t * 3)}) scale(${1 + sq} ${1 - sq + P.air * .06}) translate(-100 -170)`);
  $('shadow').setAttribute('opacity', .35 * (1 - P.air * .7));
  $('dot').style.left = P.x + 'px'; $('dot').style.top = P.y + 'px';
  $('dot').style.opacity = 1 - seg(t, ZOOM + .2, ZOOM + .6);

  // pin e ricordi
  MEM.forEach((p, k) => {
    const s = easeBack(seg(t, land(k) - .05, land(k) + .3));
    $(`pin${k}`).style.transform = `scale(${s})`;
    const shown = t >= land(k) && t < (k < MEM.length - 1 ? land(k + 1) - .45 : ZOOM + .1);
    const a = easeBack(seg(t, land(k) + .02, land(k) + .32));
    const out = k < MEM.length - 1 ? seg(t, land(k + 1) - .6, land(k + 1) - .45) : seg(t, ZOOM - .1, ZOOM + .1);
    $(`card${k}`).style.opacity = shown ? 1 - out : 0;
    $(`card${k}`).style.transform = `rotate(${(k % 2 ? 3 : -3)}deg) scale(${(.4 + .6 * a) * (1 - .2 * out)})`;
  });
  BG.forEach((p, i) => {
    const s = easeBack(seg(t, ZOOM + .3 + p.d, ZOOM + .6 + p.d));
    $(`bg${i}`).style.transform = `scale(${s})`;
  });

  // testi in alto
  const c1 = easeOut(seg(t, .05, .5));
  $('cap').style.opacity = c1 * (1 - seg(t, ZOOM, ZOOM + .3));
  $('cap').style.transform = `translateY(${(1 - c1) * 30}px)`;
  const c2 = easeOut(seg(t, ZOOM + .4, ZOOM + .9));
  $('cap2').style.opacity = c2 * (1 - seg(t, ENDT, ENDT + .3));
  $('cap2').style.transform = `translateY(${(1 - c2) * 30}px)`;

  // finale: logo
  $('end').style.opacity = seg(t, ENDT, ENDT + .35);
  letters.forEach((el, i) => {
    const p = seg(t, ENDT + .45 + i * .08, ENDT + .8 + i * .08);
    tf(el, LB[i], 0, (1 - easeOut(p)) * 260, .2 + .8 * easeBack(p), (1 - p) * -12);
    el.style.opacity = p > 0 ? 1 : 0;
  });
  const dp = seg(t, ENDT + 1.05, ENDT + 1.75);
  const squash = dp > .36 && dp < .5 ? 1 - Math.sin((dp - .36) / .14 * Math.PI) * .18 : 1;
  tf(ldot, DB, 0, (1 - bounce(dp)) * -900, 1);
  ldot.setAttribute('transform', ldot.getAttribute('transform') + ` translate(${DB.cx} ${DB.cy + DB.h / 2}) scale(${1 / squash} ${squash}) translate(${-DB.cx} ${-DB.cy - DB.h / 2})`);
  ldot.style.opacity = dp > 0 ? 1 : 0;
  const g = easeOut(seg(t, ENDT + 1.6, ENDT + 2.0));
  $('tag').style.opacity = g; $('tag').style.transform = `translateY(${(1 - g) * 24}px)`;
  const h = easeOut(seg(t, ENDT + 1.9, ENDT + 2.3));
  $('handle').style.opacity = h;
}
window.ready = Promise.all([document.fonts.ready]).then(() => render(0));
</script>
</body></html>
